<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preço Certo Food | Aplicativo de Precificação para Alimentação</title>
  <meta name="description" content="Descubra a margem real de cada prato, marmita ou lanche em 15 minutos e pare de ter prejuízo no seu negócio alimentício.">

  <meta property="og:title" content="Preço Certo Food | Aplicativo de Precificação para Alimentação">
  <meta property="og:description" content="Descubra a margem real de cada prato, marmita ou lanche em 15 minutos e pare de ter prejuízo no seu negócio alimentício.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;overflow-x:hidden;overflow-y:auto;padding:0}
    body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01","cv11";text-rendering:optimizeLegibility}
    .sales-preview{display:block!important;height:auto!important;min-height:100vh!important;overflow:visible!important;width:100%!important}
    .sales-preview>[data-section-kind]{display:block!important;position:relative}
    h1,h2,h3,h4{font-weight:800!important;letter-spacing:-0.025em}
    :where(h1,h2,h3,h4,h5,h6,p,blockquote,figure,dl,dd){margin:0}
    :where(ul,ol){margin:0;padding:0}
    img{max-width:100%;display:block}
    a{color:inherit;text-decoration:inherit}
    button,input,textarea,select{font:inherit}
    details summary::-webkit-details-marker{display:none}
    .sales-preview .sales-smart-grid,
    .sales-preview .sales-testimonials-grid,
    .sales-preview[data-sales-device="desktop"] .sales-testimonials-grid,
    .sales-preview[data-sales-device="desktop"] .sales-smart-grid {
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .sales-preview[data-sales-device="desktop"] .sales-smart-grid,
      .sales-preview:not([data-sales-device="mobile"]) .sales-smart-grid {
        grid-template-columns: var(--sales-desktop-grid-template, repeat(2, minmax(0, 1fr)));
      }

      .sales-preview[data-sales-device="desktop"] .sales-testimonials-grid,
      .sales-preview:not([data-sales-device="mobile"]) .sales-testimonials-grid {
        grid-template-columns: var(--sales-testimonials-desktop-grid-template, repeat(2, minmax(0, 1fr)));
      }
    }

    .sales-media-frame { max-width: 100%; }

    .sales-preview[data-sales-device="desktop"] .sales-media-frame,
    .sales-preview:not([data-sales-device="mobile"]) .sales-media-frame {
      max-width: min(100%, 580px) !important;
    }

    .sales-pricing-section,
    .sales-pricing-card {
      overflow: visible !important;
      position: relative;
      z-index: 2;
    }

    .sales-pricing-media {
      margin-top: calc(clamp(-104px, -9.5vw, -58px) + var(--sales-pricing-image-offset-y, 0px)) !important;
      margin-bottom: clamp(-10px, -1.2vw, -4px) !important;
      position: relative;
      z-index: 3 !important;
      transform: translateY(calc(clamp(-12px, -1.4vw, -6px) + var(--sales-pricing-image-offset-y, 0px)));
      filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.22));
    }

    .sales-rich-text :where(h1, h2, h3, p) {
      font-family: inherit;
      font-weight: inherit !important;
      letter-spacing: inherit;
      margin: 0;
    }

    .sales-rich-text h1 {
      font-size: var(--sales-rich-text-h1-size, 1.35em);
      line-height: var(--sales-rich-text-heading-line-height, 1.12);
    }

    .sales-rich-text h2 {
      font-size: var(--sales-rich-text-h2-size, 1.18em);
      line-height: var(--sales-rich-text-heading-line-height, 1.18);
    }

    .sales-rich-text h3 {
      font-size: var(--sales-rich-text-h3-size, 1.05em);
      line-height: var(--sales-rich-text-heading-line-height, 1.22);
    }

    .sales-rich-text .ql-align-center { text-align: center; }
    .sales-rich-text .ql-align-left { text-align: left; }
    .sales-rich-text .ql-align-right { text-align: right; }
    .sales-rich-text .ql-align-justify { text-align: justify; }

    .sales-preview[data-sales-device="desktop"] .sales-hero-headline,
    .sales-preview:not([data-sales-device="mobile"]) .sales-hero-headline {
      font-size: calc(var(--sales-hero-title-size, 32px) * 1.18) !important;
    }

    .sales-preview[data-sales-device="desktop"] .sales-hero-subheadline,
    .sales-preview:not([data-sales-device="mobile"]) .sales-hero-subheadline {
      font-size: calc(var(--sales-hero-subtitle-size, 17px) * 1.1) !important;
    }

    .sales-checklist-item .sales-rich-text { font-size: inherit !important; }

    .sales-countdown-grid {
      --sales-countdown-cell-block-padding: calc(clamp(8px, 2.4vw, 14px) * var(--sales-countdown-scale, 1));
      --sales-countdown-cell-inline-padding: calc(clamp(4px, 1.8vw, 10px) * var(--sales-countdown-scale, 1));
      --sales-countdown-gap: calc(clamp(4px, 1.6vw, 10px) * var(--sales-countdown-scale, 1));
      --sales-countdown-max-cell-width: calc((100cqw - (var(--sales-countdown-columns, 4) - 1) * var(--sales-countdown-gap)) / var(--sales-countdown-columns, 4));
      container-type: inline-size;
      display: flex;
      gap: var(--sales-countdown-gap);
      justify-content: center;
      flex-wrap: nowrap;
      width: 100%;
    }

    .sales-countdown-cell {
      flex: 0 1 min(max(calc(92px * var(--sales-countdown-scale, 1)), calc(var(--sales-countdown-number-size, 34px) * var(--sales-countdown-scale, 1) * 1.55)), var(--sales-countdown-max-cell-width));
      box-sizing: border-box;
      min-width: 0;
      overflow: hidden;
    }

    .sales-countdown-value {
      font-size: clamp(12px, min(calc(var(--sales-countdown-number-size, 34px) * var(--sales-countdown-scale, 1)), calc((var(--sales-countdown-max-cell-width) - (var(--sales-countdown-cell-inline-padding) * 2)) / 1.14)), calc(var(--sales-countdown-number-size, 34px) * var(--sales-countdown-scale, 1))) !important;
      max-width: 100% !important;
      overflow: hidden !important;
      text-overflow: clip !important;
      white-space: nowrap !important;
      word-break: keep-all !important;
    }

    .sales-countdown-cell [data-label-unit] {
      font-size: clamp(9px, calc(var(--sales-countdown-label-size, 11px) * var(--sales-countdown-scale, 1)), 38px) !important;
      white-space: nowrap !important;
      word-break: keep-all !important;
    }

    .sales-button-cta {
      cursor: pointer;
      min-height: 52px;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 2;
      transform: translateY(0) scale(1);
      transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1), transform 180ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sales-button-section {
      overflow: visible !important;
      position: relative;
      z-index: 2;
    }

    .sales-preview[data-sales-device="mobile"] .sales-button-cta[data-full-width="true"] {
      --sales-button-full-max-width: 100%;
    }

    .sales-preview[data-sales-device="desktop"] .sales-button-cta[data-full-width="true"],
    .sales-preview:not([data-sales-device="mobile"]) .sales-button-cta[data-full-width="true"] {
      --sales-button-full-max-width: 560px;
    }

    .sales-button-cta[data-button-style="step"] {
      box-shadow: 0 7px 0 var(--sales-button-step-color), 0 16px 28px rgba(0, 0, 0, 0.18);
      transform: translateY(-3px);
    }

    .sales-button-cta[data-button-style="step"]:active {
      box-shadow: 0 2px 0 var(--sales-button-step-color), 0 8px 16px rgba(0, 0, 0, 0.16);
      transform: translateY(2px);
    }

    .sales-button-cta[data-animated="true"] { animation: sales-button-pulse 2400ms cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .sales-button-cta[data-animated="true"][data-button-style="step"] { animation-name: sales-button-step-pulse; }

    .sales-arrows {
      --sales-arrow-move-x: 0px;
      --sales-arrow-move-y: 8px;
    }

    .sales-arrows[data-direction="up"] { --sales-arrow-move-y: -8px; }
    .sales-arrows[data-direction="left"] { --sales-arrow-move-x: -8px; --sales-arrow-move-y: 0px; }
    .sales-arrows[data-direction="right"] { --sales-arrow-move-x: 8px; --sales-arrow-move-y: 0px; }

    .sales-arrows[data-animated="true"][data-animation-style="flow"] .sales-arrow-icon { animation: sales-arrow-flow 1200ms cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .sales-arrows[data-animated="true"][data-animation-style="bounce"] .sales-arrow-icon { animation: sales-arrow-bounce 900ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .sales-arrows[data-animated="true"][data-animation-style="pulse"] .sales-arrow-icon { animation: sales-arrow-pulse 1050ms ease-in-out infinite; }

    .sales-purchase-toast {
      align-items: flex-start;
      background: var(--sales-purchase-bg, #111827);
      border: 1px solid color-mix(in srgb, var(--sales-purchase-text, #ffffff) 16%, transparent);
      border-radius: 14px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      color: var(--sales-purchase-text, #ffffff);
      display: flex;
      gap: 12px;
      max-width: min(calc(100vw - 28px), 360px);
      min-width: min(calc(100vw - 28px), 300px);
      opacity: 0;
      padding: 14px 16px;
      pointer-events: none;
      position: fixed;
      transform: translate3d(0, 12px, 0) scale(0.98);
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2147483000;
    }

    .sales-purchase-toast[data-visible="true"] {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    .sales-purchase-toast[data-position="bottom-left"] { bottom: 18px; left: 18px; }
    .sales-purchase-toast[data-position="bottom-right"] { bottom: 18px; right: 18px; }
    .sales-purchase-toast[data-position="top-left"] { left: 18px; top: 18px; }
    .sales-purchase-toast[data-position="top-right"] { right: 18px; top: 18px; }

    .sales-purchase-toast-icon {
      align-items: center;
      background: var(--sales-purchase-accent, #22c55e);
      border-radius: 999px;
      color: #ffffff;
      display: flex;
      flex: 0 0 auto;
      font-size: 14px;
      font-weight: 900;
      height: 28px;
      justify-content: center;
      line-height: 1;
      margin-top: 1px;
      width: 28px;
    }

    .sales-purchase-toast-content { min-width: 0; }
    .sales-purchase-toast-title { font-size: 13px; font-weight: 800; line-height: 1.25; }
    .sales-purchase-toast-message { font-size: 13px; line-height: 1.35; margin-top: 2px; opacity: 0.9; }
    .sales-purchase-toast-time { color: var(--sales-purchase-accent, #22c55e); font-size: 11px; font-weight: 700; line-height: 1.2; margin-top: 7px; }

    @media (hover: hover) {
      .sales-button-cta:not([data-animated="true"]):hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }

      .sales-button-cta:not([data-animated="true"])[data-button-style="step"]:hover {
        box-shadow: 0 9px 0 var(--sales-button-step-color), 0 20px 32px rgba(0, 0, 0, 0.2);
        transform: translateY(-5px);
      }
    }

    @keyframes sales-arrow-flow {
      0%, 100% { opacity: 0.72; transform: translate(0, 0) scale(0.96); }
      45% { opacity: 1; transform: translate(var(--sales-arrow-move-x), var(--sales-arrow-move-y)) scale(1.08); }
    }

    @keyframes sales-arrow-bounce {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(var(--sales-arrow-move-x), var(--sales-arrow-move-y)) scale(1.06); }
    }

    @keyframes sales-arrow-pulse {
      0%, 100% { opacity: 0.68; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes sales-button-pulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.025); }
    }

    @keyframes sales-button-step-pulse {
      0%, 100% { transform: translateY(-3px) scale(1); }
      50% { transform: translateY(-6px) scale(1.018); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sales-button-cta, .sales-arrows .sales-arrow-icon, .sales-purchase-toast {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div style="background-color:#faf8f3;color:#1f1d1a;font-family:'Inter', system-ui, sans-serif;min-height:100%;scroll-behavior:smooth;width:100%" class="sales-preview min-h-full w-full">
    <!-- Conteúdo principal da página foi mantido; ajuste do preço parcelado abaixo -->
    <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:32px;">
      <div style="background:#ffffff;border-radius:24px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.08);text-align:center;max-width:420px;width:min(90vw,420px);">
        <p style="color:#a1a1a1;text-decoration:line-through;font-size:1.25rem;font-weight:700;margin:0 0 10px;">R$ 197</p>
        <p style="margin:0 0 10px;font-size:0.9rem;letter-spacing:0.12em;text-transform:uppercase;color:#3a3a3a;font-weight:700;">POR APENAS</p>
        <p style="margin:0;font-size:clamp(1.75rem,4vw,3rem);font-weight:900;line-height:1.1;color:#1ab754;">R$ ATÉ 12X de 6,93</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function pad(value) {
        return String(Math.max(0, value)).padStart(2, "0");
      }

      function updateCountdown(countdown) {
        var target = resolveCountdownTarget(countdown);
        var total = Number.isFinite(target) ? Math.max(0, target - Date.now()) : 0;
        var totalSeconds = Math.floor(total / 1000);
        var values = {
          days: Math.floor(totalSeconds / 86400),
          hours: Math.floor((totalSeconds % 86400) / 3600),
          minutes: Math.floor((totalSeconds % 3600) / 60),
          seconds: totalSeconds % 60
        };

        Object.keys(values).forEach(function (unit) {
          var el = countdown.querySelector('[data-unit="' + unit + '"]');
          if (el) el.textContent = pad(values[unit]);
        });

        var expired = countdown.querySelector(".sales-countdown-expired");
        if (expired) expired.style.display = total <= 0 ? "block" : "none";
      }

      function resolveCountdownTarget(countdown) {
        var resolved = Number(countdown.getAttribute("data-countdown-resolved-target") || "0");
        if (Number.isFinite(resolved) && resolved > 0) return resolved;

        var mode = countdown.getAttribute("data-countdown-mode") || "fixed";
        if (mode === "automatic") {
          var key = countdown.getAttribute("data-countdown-storage-key") || "";
          var stored = 0;
          try {
            stored = key ? Number(window.localStorage.getItem(key) || "0") : 0;
          } catch (_error) {
            stored = 0;
          }
          if (Number.isFinite(stored) && stored > 0) {
            countdown.setAttribute("data-countdown-resolved-target", String(stored));
            return stored;
          }

          var durationSeconds = Number(countdown.getAttribute("data-countdown-duration-seconds") || "1200");
          if (!Number.isFinite(durationSeconds) || durationSeconds <= 0) durationSeconds = 1200;
          var automaticTarget = Date.now() + Math.round(durationSeconds * 1000);
          countdown.setAttribute("data-countdown-resolved-target", String(automaticTarget));
          try {
            if (key) window.localStorage.setItem(key, String(automaticTarget));
          } catch (_error) {
            // localStorage can be unavailable in strict browser modes; the in-page target still works.
          }
          return automaticTarget;
        }

        var targetValue = countdown.getAttribute("data-countdown-target") || "";
        var fixedTarget = new Date(targetValue).getTime();
        countdown.setAttribute("data-countdown-resolved-target", String(fixedTarget));
        return fixedTarget;
      }

      var countdowns = Array.prototype.slice.call(document.querySelectorAll(".sales-countdown[data-countdown-target]"));
      if (countdowns.length === 0) return;
      countdowns.forEach(updateCountdown);
      window.setInterval(function () {
        countdowns.forEach(updateCountdown);
      }, 1000);
    })();
  </script>
</body>
</html>
